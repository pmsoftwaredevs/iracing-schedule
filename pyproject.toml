[project]
name = "iracing-calendar"
version = "0.1.0"
description = "Build-time pipeline that refreshes docs/data/*.json (season schedule + special events cache) for the iRacing Calendar static site"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pydantic-settings>=2.4",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
