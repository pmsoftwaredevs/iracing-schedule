# Sample Apache 2 vhost: TLS termination + reverse proxy to the Docker container.
#
# Requires: a2enmod proxy proxy_http headers ssl
#
# Install:
#   sudo cp deploy/apache-iracing-calendar.conf /etc/apache2/sites-available/
#   sudo a2ensite apache-iracing-calendar
#   sudo systemctl reload apache2
#
# Then get a cert (e.g. certbot --apache -d calendar.example.com), which will
# rewrite the :443 block below to add SSLCertificateFile/SSLCertificateKeyFile
# and usually adds its own https redirect to replace the :80 block's RewriteRule.

<VirtualHost *:80>
    ServerName calendar.example.com

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName calendar.example.com

    SSLEngine on
    # SSLCertificateFile and SSLCertificateKeyFile go here (certbot fills these
    # in automatically if you use --apache).

    # The app builds absolute manage/subscribe URLs from IRCAL_BASE_URL rather
    # than from request headers, so X-Forwarded-Proto isn't load-bearing today —
    # set it anyway since it's the correct thing behind any reverse proxy and
    # costs nothing if unused.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPreserveHost On
    ProxyPass "/" "http://127.0.0.1:6337/"
    ProxyPassReverse "/" "http://127.0.0.1:6337/"

    ErrorLog ${APACHE_LOG_DIR}/iracing-calendar-error.log
    CustomLog ${APACHE_LOG_DIR}/iracing-calendar-access.log combined
</VirtualHost>
