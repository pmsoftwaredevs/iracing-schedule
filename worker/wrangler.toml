name = "iracing-calendar-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# No Cloudflare Custom Domain: pmsoftwaredevs.com's DNS lives at another
# registrar, and Cloudflare Workers Custom Domains/Routes require the
# hostname's zone to be on Cloudflare — a subdomain-only zone needs an
# Enterprise plan. The Worker is public only at its workers.dev URL:
# https://iracing-calendar-worker.pmsoftwaredevs-0ad.workers.dev
# See DEPLOYMENT.md's "Custom domain setup" section for the tradeoff.

# The published GitHub Pages site this Worker fetches data/manifest.json and
# data/{season}.json from (see src/season-data.js) — override at deploy time
# with `--var PAGES_BASE_URL:...` or for local dev with `wrangler dev --var
# PAGES_BASE_URL:http://localhost:<port>` pointed at a locally-served docs/.
[vars]
PAGES_BASE_URL = "https://iracing.pmsoftwaredevs.com"
